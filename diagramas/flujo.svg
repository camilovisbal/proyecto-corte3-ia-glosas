<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <style>
      .c{stroke:#333;stroke-width:1.4;rx:8}
      .t{font-weight:600;font-size:15px}
      .s{font-size:12.5px;fill:#333}
      .p{font-weight:700;font-size:13px;fill:#0b5394}
      .l{stroke:#333;stroke-width:1.5;fill:none;marker-end:url(#f)}
    </style>
  </defs>
  <rect width="1000" height="1060" fill="#fff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="700">Flujo propuesto: 15.000 historias al mes, de la atención a la firma del auditor</text>
  <text x="500" y="52" text-anchor="middle" class="s">Porcentajes sobre el total mensual (15.000 = 100 %). Todo corre dentro de la clínica (Cap. 4).</text>

  <!-- Ingesta -->
  <rect x="300" y="70" width="400" height="62" class="c" fill="#eef3fb"/>
  <text x="500" y="94" text-anchor="middle" class="t">0. Ingesta al cerrar la atención (egreso)</text>
  <text x="500" y="116" text-anchor="middle" class="s">no al radicar · 12.000 cortas + 3.000 hospitalizaciones</text>
  <text x="712" y="106" class="p">100 % · 15.000</text>

  <path d="M430,132 L250,180" class="l"/>
  <path d="M570,132 L750,180" class="l"/>

  <!-- OCR -->
  <rect x="80" y="180" width="340" height="96" class="c" fill="#fff4e0"/>
  <text x="250" y="204" text-anchor="middle" class="t">1. OCR (solo PDF escaneado)</text>
  <text x="250" y="226" text-anchor="middle" class="s">PP-OCR en CPU, servidores existentes</text>
  <text x="250" y="246" text-anchor="middle" class="s">valida CIE-10 contra catálogo; confianza baja</text>
  <text x="250" y="264" text-anchor="middle" class="s">→ marca «revisar: ilegible» sin pasar por IA</text>
  <text x="92" y="172" class="p">20 % · 3.000 (≈25.200 páginas)</text>

  <rect x="580" y="180" width="340" height="96" class="c" fill="#f3f3f3"/>
  <text x="750" y="210" text-anchor="middle" class="t">Historia con texto nativo</text>
  <text x="750" y="234" text-anchor="middle" class="s">sale del sistema de historias clínicas</text>
  <text x="750" y="254" text-anchor="middle" class="s">sin OCR</text>
  <text x="808" y="172" class="p">80 % · 12.000</text>

  <path d="M250,276 L430,330" class="l"/>
  <path d="M750,276 L570,330" class="l"/>

  <!-- Normalizacion + regla -->
  <rect x="250" y="330" width="500" height="80" class="c" fill="#eef3fb"/>
  <text x="500" y="354" text-anchor="middle" class="t">2a. Normalización + regla de contrato (sin IA)</text>
  <text x="500" y="376" text-anchor="middle" class="s">corta por secciones · valor facturado vs. tarifa del contrato de la EPS</text>
  <text x="500" y="396" text-anchor="middle" class="s">diferencia de tarifa → «revisar: tarifa» directo al auditor (25 % de las causas)</text>
  <text x="760" y="372" class="p">100 % · 0 tokens</text>

  <path d="M500,410 L500,450" class="l"/>

  <!-- Modelo pequeño -->
  <rect x="250" y="450" width="500" height="86" class="c" fill="#e6f4ea"/>
  <text x="500" y="474" text-anchor="middle" class="t">2b. Modelo pequeño: Qwen3-14B (INT4, GPU)</text>
  <text x="500" y="496" text-anchor="middle" class="s">lee la historia completa · salida: bajo / revisar + causa + confianza</text>
  <text x="500" y="516" text-anchor="middle" class="s">criterio: confianza ≥ 0,8 decide; banda gris 0,2–0,8 sube al LLM</text>
  <text x="760" y="492" class="p">100 % · 15.000</text>

  <path d="M330,536 L180,600" class="l"/>
  <path d="M500,536 L500,600" class="l"/>
  <path d="M670,536 L820,600" class="l"/>

  <rect x="40" y="600" width="280" height="70" class="c" fill="#f3f3f3"/>
  <text x="180" y="626" text-anchor="middle" class="t">«bajo» con confianza alta</text>
  <text x="180" y="648" text-anchor="middle" class="p">72 % · 10.800</text>

  <rect x="350" y="600" width="300" height="104" class="c" fill="#fde8e8"/>
  <text x="500" y="624" text-anchor="middle" class="t">3. LLM: Qwen3.8-27B (INT4, GPU)</text>
  <text x="500" y="646" text-anchor="middle" class="s">solo dudosas + hospitalizaciones en riesgo</text>
  <text x="500" y="666" text-anchor="middle" class="s">cita el fragmento que sustenta la alerta</text>
  <text x="500" y="686" text-anchor="middle" class="s">sin razonamiento extendido (ver Cap. 1)</text>
  <text x="510" y="578" class="p">20 % · 3.000</text>

  <rect x="680" y="600" width="280" height="70" class="c" fill="#f3f3f3"/>
  <text x="820" y="626" text-anchor="middle" class="t">«revisar» con confianza alta</text>
  <text x="820" y="648" text-anchor="middle" class="p">8 % · 1.200 (incluye tarifa)</text>

  <path d="M430,704 L260,780" class="l"/>
  <path d="M570,704 L740,780" class="l"/>
  <text x="300" y="742" class="s">13 % bajo</text>
  <text x="650" y="742" class="s">7 % revisar</text>
  <path d="M180,670 L180,780" class="l"/>
  <path d="M820,670 L820,780" class="l"/>

  <!-- Bandejas -->
  <rect x="40" y="780" width="400" height="86" class="c" fill="#f3f3f3"/>
  <text x="240" y="804" text-anchor="middle" class="t">Bandeja «bajo»: 85 % · 12.750</text>
  <text x="240" y="826" text-anchor="middle" class="s">firma por lote; muestra aleatoria de 750 (5 % del total)</text>
  <text x="240" y="846" text-anchor="middle" class="s">se revisa completa como control de calidad</text>

  <rect x="560" y="780" width="400" height="86" class="c" fill="#fde8e8"/>
  <text x="760" y="804" text-anchor="middle" class="t">Bandeja «revisar»: 15 % · 2.250</text>
  <text x="760" y="826" text-anchor="middle" class="s">ordenada por valor × riesgo, con causa probable</text>
  <text x="760" y="846" text-anchor="middle" class="s">y evidencia citada; revisión completa</text>

  <path d="M240,866 L430,920" class="l"/>
  <path d="M760,866 L570,920" class="l"/>

  <rect x="250" y="920" width="500" height="80" class="c" fill="#fff4e0" stroke-width="2.4"/>
  <text x="500" y="946" text-anchor="middle" class="t">4. Auditor humano firma cada decisión (100 %)</text>
  <text x="500" y="968" text-anchor="middle" class="s">corrige código o pide soporte; la IA no factura ni radica</text>
  <text x="500" y="988" text-anchor="middle" class="s">revisión completa en el pico: 360/día vs. capacidad 720/día</text>

  <path d="M500,1000 L500,1030" class="l"/>
  <text x="500" y="1048" text-anchor="middle" class="t">Facturación radica ante la EPS (persona) · la glosa real vuelve como dato para recalibrar umbrales</text>
</svg>
